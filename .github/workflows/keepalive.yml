# Mantiene despierto el proyecto de Supabase.
# El plan gratuito pausa los proyectos tras 7 días sin actividad; esto llama a
# la función public.ping() cada 2 días, así el contador nunca llega a 7.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 12 */2 * *'   # 12:00 UTC, cada 2 días
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          # La anon key es pública por diseño (ya está en js/config.js);
          # la seguridad la dan RLS + Auth, no el secreto de esta clave.
          SUPABASE_URL: https://quaeilliervjjdlxzfaq.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1YWVpbGxpZXJ2ampkbHh6ZmFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTg3NDcsImV4cCI6MjA5NjU5NDc0N30.TivpoPLOBz3Pg4A-Zp_T5YWiXFbUvj7w7mgEJf9dJCo
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
          echo "Ping OK — $(date -u '+%Y-%m-%d %H:%M UTC')"
