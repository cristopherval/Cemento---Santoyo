# Mantiene despierto el proyecto de Supabase.
# El plan gratuito pausa los proyectos tras 7 días sin actividad; esto llama a
# la función public.ping() cada 2 días, así el contador nunca llega a 7.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 12 */2 * *'   # 12:00 UTC, cada 2 días
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano

permissions:
  contents: write             # necesario para el commit de mantenimiento

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0      # historial completo: evita "shallow update not allowed" al hacer push

      - name: Ping Supabase
        env:
          # La anon key es pública por diseño (ya está en js/config.js);
          # la seguridad la dan RLS + Auth, no el secreto de esta clave.
          SUPABASE_URL: https://quaeilliervjjdlxzfaq.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF1YWVpbGxpZXJ2ampkbHh6ZmFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTg3NDcsImV4cCI6MjA5NjU5NDc0N30.TivpoPLOBz3Pg4A-Zp_T5YWiXFbUvj7w7mgEJf9dJCo
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-delay 30 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo ""
          echo "Ping OK — $(date -u '+%Y-%m-%d %H:%M UTC')"

      # GitHub desactiva los cron de repos públicos que pasan 60 días sin
      # commits (las corridas del propio cron NO cuentan como actividad). Este
      # paso hace un commit de mantenimiento solo cuando el último commit ya
      # tiene más de 45 días, así el contador nunca llega a 60 y el historial
      # se mantiene limpio (unos 8 commits al año en el peor caso).
      - name: Keep the workflow from being auto-disabled
        run: |
          set -euo pipefail
          LAST=$(git log -1 --format=%ct)
          DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "Último commit hace $DAYS días."
          if [ "$DAYS" -lt 45 ]; then
            echo "El repo sigue activo; no hace falta commit."
            exit 0
          fi
          date -u '+%Y-%m-%d %H:%M UTC' > .github/last-keepalive.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: keepalive (mantiene activo el cron de Supabase)"
          git push
          echo "Commit de mantenimiento hecho: el contador de 60 días se reinició."
